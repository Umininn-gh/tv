    <style>
        * {
            box-sizing: border-box;

        body {

        #top-bar {

            justify-content: space-between;
            overflow: hidden;
            min-height: 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            flex-wrap: nowrap;
            gap: 0.625em;
        }

        #lists {
            display: flex;
            flex-wrap: nowrap;
            gap: 0.5em;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
            padding: 0.3125em 0;
            -ms-overflow-style: none;
            scrollbar-width: none;

        #lists::-webkit-scrollbar {

        .button-wrapper {

            display: inline-flex;
            flex-shrink: 0;
            margin-right: 0.3125em;
        }

        .status-button {
            background: linear-gradient(145deg, #2d2d2d, #222);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #eee;
            padding: 0.5em 1em;
            border-radius: 8px;

            white-space: nowrap;
            font-size: clamp(10px, 0.85vw, 14px);
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-button:hover {
            background: linear-gradient(145deg, #383838, #2d2d2d);
            transform: translateY(-1px);

        .live {
            color: #00ff88 !important;

        .not-live {
            color: #ff3333 !important;

        }
        .unknown {
            color: #FFFFFF !important;
            border-color: #FFFFFF !important;
        }
        .unknown2 {
            color: #00ff88 !important;
            animation: pulse-glow 1.5s infinite !important;
            border: 2px solid #00ff88 !important;
        }

        @keyframes pulse-glow {

    <script>
        // ======================== 全域變數 ========================
        let TWITCH_TOKEN = "";
        let TWITCH_CLIENT_ID = "";
        let channels = [];               // 儲存所有頻道物件
        let channelStatuses = {};       // 記錄每個頻道的直播狀態
        let currentHLSInstances = [];   // 存放 HLS.js 實例便於銷毀

        function channelStatusKey(channel) {
            return ChannelList.channelKey(channel);
        }

        function channelDomId(channel) {
            return channelStatusKey(channel).replace(/[^a-zA-Z0-9]/g, '_');
        }

        async function fetchGoshChannel(channel) {
            const proxies = ['https://gosh.chicktv02.workers.dev', 'https://dry-wildflower-371d.forgosh.workers.dev'];
            for (const proxy of proxies) {
                try {
                    const response = await fetch(`${proxy}/?channelId=${encodeURIComponent(channel.id)}`);
                    if (!response.ok) continue;
                    const data = await response.json();
                    if (data && typeof data.isLive === 'boolean') return data;
                } catch (error) {}
            }
            throw new Error('Unable to load Gosh channel');
        }

        async function attachHlsVideo(videoElem, channel) {
            try {
                const source = channel.platform === 'gosh' ? (await fetchGoshChannel(channel)).m3u8Url : channel.id;
                if (!videoElem.isConnected) return;
                if (typeof source !== 'string' || !/^https?:\/\//i.test(source)) throw new Error('No active HLS stream');
                if (Hls.isSupported()) {
                    const hls = new Hls({ enableWorker: true, autoStartLoad: true });
                    hls.loadSource(source);
                    hls.attachMedia(videoElem);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => videoElem.play().catch(() => {}));
                    currentHLSInstances.push(hls);
                } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElem.src = source;
                } else {
                    throw new Error('HLS unavailable');
                }
            } catch (error) {
                if (!videoElem.isConnected) return;
                const message = document.createElement('div');
                message.style.cssText = 'color:#aaa;text-align:center;padding:2rem';
                message.textContent = '目前未有可播放的直播訊號';
                videoElem.replaceWith(message);
            }
        }

        // ======================== HLS 清理函式 ========================
        function destroyAllHLSInstances() {
            if (currentHLSInstances.length) {
                currentHLSInstances.forEach(instance => {
                    if (instance && typeof instance.destroy === 'function') instance.destroy();
                });
                currentHLSInstances = [];
            }
        }

        // ======================== 單一頻道播放（主畫面）================
        function displaySingleChannel(channel) {
            const container = document.getElementById("multi-stream-container");
            if (!container) return;
            destroyAllHLSInstances();
            container.innerHTML = "";
            if (!channel) {
                container.innerHTML = `<div style="color:#aaa; text-align:center; padding:2rem;">未選擇頻道</div>`;
                return;
            }
            const platform = channel.platform;
            const idOrUrl = channel.id;

            // M3U8 使用 HLS.js
            if (platform === "m3u8" || platform === "gosh") {
                const videoElem = document.createElement("video");
                videoElem.className = "hls-video-element";
                videoElem.controls = true;
                videoElem.autoplay = true;
                videoElem.muted = false;
                videoElem.playsInline = true;
                videoElem.style.width = "100%";
                videoElem.style.height = "100%";
                container.appendChild(videoElem);
                void attachHlsVideo(videoElem, channel);
            }
            // YouTube 直播嵌入
            else if (platform === "youtube") {
                const iframe = document.createElement("iframe");
                iframe.className = "full-screen-video";
                // 判斷是頻道 ID (UC開頭) 或是影片 ID
                let embedSrc = "";
                if (idOrUrl.startsWith("UC") || idOrUrl.startsWith("HC") || idOrUrl.includes("channel")) {
                    embedSrc = `https://www.youtube.com/embed/live_stream?channel=${idOrUrl}&autoplay=1&mute=0`;
                } else {
                    embedSrc = `https://www.youtube.com/embed/${idOrUrl}?autoplay=1&mute=0`;
                }
                iframe.src = embedSrc;
                iframe.allowFullscreen = true;
				iframe.referrerpolicy = "strict-origin-when-cross-origin";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                iframe.frameBorder = "0";
                container.appendChild(iframe);
            }
            // 其他平台（Twitch、Kick、OK、AngelThump）使用 iframe
            else {
                const iframe = document.createElement("iframe");
                iframe.className = "full-screen-video";
                iframe.src = getStreamUrl(channel);
                iframe.allowFullscreen = true;
                iframe.allow = "autoplay";
                iframe.frameBorder = "0";
                container.appendChild(iframe);
            }
        }

        // 取得各平台 iframe 嵌入網址（不包含 M3U8 / YouTube）
        function getStreamUrl(channel) {
            if (!channel) return "";
            if (channel.platform === "kick") return `https://player.kick.com/${channel.id}?muted=false&autoplay=true`;
            if (channel.platform === "twitch") return `https://player.twitch.tv/?channel=${channel.id}&parent=${encodeURIComponent(location.hostname || 'localhost')}`;
            if (channel.platform === "ok") return `https://ok.ru/videoembed/${channel.id}?nochat=1&autoplay=1`;
            if (channel.platform === "at") return `https://player.angelthump.com/?channel=${channel.id}`;
            return "";
        }

        // ======================== 看更台（多視窗）=====================
        function watchSelectedChannels() {
            const selectionDiv = document.getElementById("channel-selection");
            if (selectionDiv) selectionDiv.style.display = "none";
            const container = document.getElementById("multi-stream-container");
            if (!container) return;
            destroyAllHLSInstances();
            container.innerHTML = "";
            const checkboxes = document.querySelectorAll("#channel-options input:checked");
            const selected = Array.from(checkboxes).map(cb => ({ 
                id: cb.value, 
                platform: cb.dataset.platform,
                name: cb.dataset.name || ""
            }));
            const fullSelected = selected.map(sel => channels.find(ch => ch.id === sel.id && ch.platform === sel.platform)).filter(Boolean);
            if (fullSelected.length === 0) {
                container.innerHTML = `<div style="color:#aaa; text-align:center; padding:2rem;">未選擇任何頻道</div>`;
                return;
            }
            const isOnlyOne = fullSelected.length === 1;
            fullSelected.forEach(ch => {
                const platform = ch.platform;
                const idOrUrl = ch.id;
                const wrapperClass = isOnlyOne ? "full-screen-video" : "video";
                if (platform === "m3u8" || platform === "gosh") {
                    const videoElem = document.createElement("video");
                    videoElem.className = `hls-video-element ${wrapperClass}`;
                    videoElem.controls = true;
                    videoElem.autoplay = true;
                    videoElem.muted = false;
                    videoElem.playsInline = true;
                    if (!isOnlyOne) {
                        videoElem.style.width = "48%";
                        videoElem.style.height = "48%";
                        
                    } else {
                        videoElem.style.width = "100%";
                        videoElem.style.height = "100%";
                    }
                    container.appendChild(videoElem);
                    void attachHlsVideo(videoElem, ch);
                } else if (platform === "youtube") {
                    const iframe = document.createElement("iframe");
                    iframe.className = wrapperClass;
                    let embedSrc = "";
                    if (idOrUrl.startsWith("UC") || idOrUrl.startsWith("HC") || idOrUrl.includes("channel")) {
                        embedSrc = `https://www.youtube.com/embed/live_stream?channel=${idOrUrl}&autoplay=1`;
                    } else {
                        embedSrc = `https://www.youtube.com/embed/${idOrUrl}?autoplay=1`;
                    }
                    iframe.src = embedSrc;
                    iframe.allowFullscreen = true;
					iframe.referrerpolicy = "strict-origin-when-cross-origin";
                    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                    iframe.frameBorder = "0";
                    if (!isOnlyOne) {
                        iframe.style.width = "48%%";
                        iframe.style.height = "48%";
                    }
                    container.appendChild(iframe);
                } else {
                    const iframe = document.createElement("iframe");
                    iframe.className = wrapperClass;
                    iframe.src = getStreamUrl(ch);
                    iframe.allowFullscreen = true;
                    iframe.allow = "autoplay";
                    iframe.frameBorder = "0";
                    container.appendChild(iframe);
                }
            });
        }

        // ======================== 加台彈窗邏輯 ========================
        function openAddChannelModal() {
            const modal = document.getElementById('addChannelModal');
            if (!modal) return;
            document.getElementById('modal-channel-name').value = '';
            document.getElementById('modal-channel-id').value = '';
            document.getElementById('modal-channel-platform').value = 'twitch';
            modal.classList.add('active');
        }
        function closeAddChannelModal() {
            const modal = document.getElementById('addChannelModal');
            if (modal) modal.classList.remove('active');
        }
        function addChannelFromModal() {
            const name = document.getElementById('modal-channel-name').value.trim();
            const id = document.getElementById('modal-channel-id').value.trim();
            const platform = document.getElementById('modal-channel-platform').value.toLowerCase();
            if (!name || !id || !platform) {
                alert("❌ 請完整填寫頻道名稱、ID 及平台");
                return;
            }
            if (platform === "m3u8" && !id.match(/\.m3u8($|\?)/i) && !id.startsWith("http")) {
                if (!confirm("⚠️ 網址可能不是標準 .m3u8 格式，仍要新增嗎？")) return;
            }
            const newChannel = { name, id, platform };
            ChannelList.restoreChannel(localStorage, newChannel);
            channels = ChannelList.mergeChannels([newChannel], channels);
            saveChannelsToStorage();
            generateButtons();
            closeAddChannelModal();
            fetchAllStatuses();
        }

        // 儲存自訂頻道到 localStorage
        function saveChannelsToStorage() {
            ChannelList.saveCustomChannels(localStorage, channels);
        }

        // ======================== 載入 Twitch 憑證 ========================
        async function loadTwitchCredentials() {
            try {
                const response = await fetch('./token.txt', { cache: 'no-store' });
                if (!response.ok) return;
                const data = await response.text();
                const lines = data.split('\n').map(line => line.trim());
                if (lines.length >= 2) {
                    TWITCH_TOKEN = lines[0];
                    TWITCH_CLIENT_ID = lines[1];
                    console.log('Twitch credentials loaded');
                } else {
                    console.error('Invalid token format');
                }
            } catch (error) {
                console.error('Error loading Twitch credentials:', error);
            }
        }

        // ======================== 從外部來源載入頻道清單 =================
        async function loadChannelsFromUrl() {
            const loaded = await ChannelList.loadChannels(localStorage, fetch);
            channels = loaded.channels;
            generateButtons();
        }

        // ======================== 產生頂部按鈕 & 刪除模式 =================
        function generateButtons() {
            const container = document.getElementById("lists");
            if (!container) return;
            container.innerHTML = "";
            if (window.innerWidth > 768) {
                channels.forEach(channel => addButton(channel));
            }
            fetchAllStatuses();
        }

        function addButton(channel) {
            const container = document.getElementById("lists");
            if (!container) return;
            const btn = document.createElement("button");
            const safeId = channelDomId(channel);
            btn.className = "status-button";
            btn.id = `btn-${safeId}`;
            let platformIcon = "ⓞ";
            if (channel.platform === "kick") platformIcon = "Ⓚ";
            else if (channel.platform === "twitch") platformIcon = "Ⓣ";
            else if (channel.platform === "at") platformIcon = "Ⓐ";
            else if (channel.platform === "m3u8") platformIcon = "📺";
            else if (channel.platform === "gosh") platformIcon = "Ⓖ";
            else if (channel.platform === "youtube") platformIcon = "▶️";
            else if (channel.platform === "ok") platformIcon = "ⓞ";
            btn.innerText = `${platformIcon}${channel.name}`;
            btn.onclick = () => { displaySingleChannel(channel); };
            const deleteBtn = document.createElement("button");
            deleteBtn.innerText = "x";
            deleteBtn.style.display = "none";
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                ChannelList.forgetChannel(localStorage, channel);
                channels = channels.filter(ch => !(ch.id === channel.id && ch.platform === channel.platform));
                saveChannelsToStorage();
                generateButtons();
                if (channels.length === 0) displaySingleChannel(null);
                if (document.getElementById("channel-selection").style.display !== "none") generateChannelOptions();
            };
            const wrapper = document.createElement("div");
            wrapper.className = "button-wrapper";
            wrapper.appendChild(btn);
            wrapper.appendChild(deleteBtn);
            container.appendChild(wrapper);
            updateButtonStatus(channel);
        }

        function editClick() {
            document.querySelectorAll(".button-wrapper button:last-child").forEach(btn => {
                if (btn.innerText === "x") btn.style.display = "inline-flex";
            });
            setTimeout(() => {
                document.querySelectorAll(".button-wrapper button:last-child").forEach(btn => {
                    if (btn.innerText === "x") btn.style.display = "none";
                });
            }, 8000);
        }

        // ======================== 狀態更新（UI 樣式）====================
        function updateButtonStatus(channel) {
            const safeId = channelDomId(channel);
            const btn = document.getElementById(`btn-${safeId}`);
            if (!btn) return;
            const status = channelStatuses[channelStatusKey(channel)] || 'unknown';
            btn.classList.remove('live', 'not-live', 'unknown', 'unknown2');
            if (status === 'live') btn.classList.add('live');
            else if (status === 'not-live') btn.classList.add('not-live');
            else if (status === 'unknown2') btn.classList.add('unknown2');
            else btn.classList.add('unknown');
        }

        function updateMenuButtonStatus(channel) {
            const safeId = channelDomId(channel);
            const menuBtn = document.getElementById(`menu-btn-${safeId}`);
            const statusInd = document.getElementById(`menu-status-${safeId}`);
            if (!menuBtn) return;
            const status = channelStatuses[channelStatusKey(channel)] || 'unknown';
            menuBtn.classList.remove('live', 'not-live', 'unknown', 'unknown2');
            if (statusInd) {
                statusInd.classList.remove('status-live', 'status-not-live', 'status-unknown');
                if (status === 'live') statusInd.classList.add('status-live');
                else if (status === 'not-live') statusInd.classList.add('status-not-live');
                else statusInd.classList.add('status-unknown');
            }
            if (status === 'live') menuBtn.classList.add('live');
            else if (status === 'not-live') menuBtn.classList.add('not-live');
            else if (status === 'unknown2') menuBtn.classList.add('unknown2');
            else menuBtn.classList.add('unknown');
        }

        function updateChannelOptionLabel(channel) {
            const label = document.getElementById(`status-label-${channelDomId(channel)}`);
            if (!label) return;
            const status = channelStatuses[channelStatusKey(channel)] || 'unknown';
            label.classList.remove('live', 'not-live', 'unknown', 'unknown2');
            if (status === 'live') label.classList.add('live');
            else if (status === 'not-live') label.classList.add('not-live');
            else if (status === 'unknown2') label.classList.add('unknown2');
            else label.classList.add('unknown');
        }

        // ======================== 漢堡選單 ========================
        function toggleChannelMenu() {
            const menu = document.getElementById('channel-menu');
            const listContainer = document.getElementById('menu-channel-list');
            if (!menu) return;
            const isHidden = menu.style.display === 'none' || getComputedStyle(menu).display === 'none';
            if (isHidden) {
                document.getElementById('channel-count').textContent = channels.length;
                listContainer.innerHTML = '';
                channels.forEach(channel => {
                    const safeId = channelDomId(channel);
                    const btn = document.createElement('button');
                    btn.className = 'menu-status-button status-button';
                    btn.id = `menu-btn-${safeId}`;
                    const statusSpan = document.createElement('span');
                    statusSpan.className = 'status-indicator';
                    statusSpan.id = `menu-status-${safeId}`;
                    const textSpan = document.createElement('span');
                    let icon = "ⓞ";
                    if (channel.platform === "kick") icon = "Ⓚ";
                    else if (channel.platform === "twitch") icon = "Ⓣ";
                    else if (channel.platform === "at") icon = "Ⓐ";
                    else if (channel.platform === "m3u8") icon = "📺";
                    else if (channel.platform === "gosh") icon = "Ⓖ";
                    else if (channel.platform === "youtube") icon = "▶️";
                    textSpan.textContent = `${icon}${channel.name}`;
                    btn.appendChild(statusSpan);
                    btn.appendChild(textSpan);
                    btn.onclick = () => { displaySingleChannel(channel); toggleChannelMenu(); };
                    listContainer.appendChild(btn);
                    updateMenuButtonStatus(channel);
                });
                menu.style.display = 'block';
                document.body.style.overflow = 'hidden';
            } else {
                menu.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        // ======================== 看更台面板 ========================
        function toggleChannelSelection() {
            const div = document.getElementById("channel-selection");
            if (!div) return;
            if (div.style.display === "none") {
                generateChannelOptions();
                div.style.display = "block";
            } else div.style.display = "none";
        }

        function generateChannelOptions() {
            const container = document.getElementById("channel-options");
            if (!container) return;
            container.innerHTML = "";
            channels.forEach(channel => {
                const wrapper = document.createElement("div");
                wrapper.style.margin = "5px 0";
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.value = channel.id;
                cb.dataset.platform = channel.platform;
                cb.dataset.name = channel.name;
                cb.id = `chk_${channelDomId(channel)}`;
                const label = document.createElement("label");
                label.htmlFor = cb.id;
                label.className = "channel-option-label";
                label.id = `status-label-${channelDomId(channel)}`;
                let icon = "ⓞ";
                if (channel.platform === "kick") icon = "Ⓚ";
                else if (channel.platform === "twitch") icon = "Ⓣ";
                else if (channel.platform === "at") icon = "Ⓐ";
                else if (channel.platform === "m3u8") icon = "📺";
                else if (channel.platform === "gosh") icon = "Ⓖ";
                else if (channel.platform === "youtube") icon = "▶️";
                label.textContent = `${icon}${channel.name}`;
                wrapper.appendChild(cb);
                wrapper.appendChild(label);
                container.appendChild(wrapper);
                updateChannelOptionLabel(channel);
            });
			fetchAllStatuses();
        }

        // ======================== 直播狀態查詢 ========================
        async function fetchStatus(channel) {
            if (!channel || !channel.id) return;
            const key = channelStatusKey(channel);
            let status = 'unknown';
            try {
                if (channel.platform === 'at' || channel.platform === 'youtube') {
                    status = 'unknown2';
                } else if (channel.platform === 'm3u8') {
                    status = 'live';
                } else if (channel.platform === 'gosh') {
                    const data = await fetchGoshChannel(channel);
                    status = data.isLive ? 'live' : 'not-live';
                } else {
                    const url = getPlatformUrl(channel);
                    if (!url || (channel.platform === 'twitch' && (!TWITCH_TOKEN || !TWITCH_CLIENT_ID))) {
                        channelStatuses[key] = status;
                        updateUIForChannel(channel);
                        return;
                    }
                    const headers = channel.platform === 'twitch' ? { 'Authorization': `Bearer ${TWITCH_TOKEN}`, 'Client-Id': TWITCH_CLIENT_ID } : {};
                    const response = await fetch(url, { headers });
                    if (!response.ok) throw new Error('Channel status unavailable');
                    if (channel.platform === 'ok') {
                        const html = await response.text();
                        status = html.includes('status:"online"') || html.includes('"status":"online"') ? 'live' : 'not-live';
                    } else {
                        const data = await response.json();
                        const live = channel.platform === 'kick' ? data.livestream?.is_live === true : data.data?.length > 0;
                        status = live ? 'live' : 'not-live';
                    }
                }
            } catch(e) {
                status = 'unknown';
            }
            channelStatuses[key] = status;
            updateUIForChannel(channel);
        }
        
        function updateUIForChannel(channel) {
            updateButtonStatus(channel);
            updateMenuButtonStatus(channel);
            updateChannelOptionLabel(channel);
        }
        
        function getPlatformUrl(channel) {
            if (channel.platform === "kick") return `https://kick.com/api/v2/channels/${channel.id}`;
            if (channel.platform === "twitch") return `https://api.twitch.tv/helix/streams?user_login=${channel.id}`;
            if (channel.platform === "ok") return `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent('https://ok.ru/videoembed/' + channel.id)}`;
            return "";
        }

        function fetchAllStatuses() {
            channels.forEach(ch => fetchStatus(ch));
        }

        // ======================== 聊天室切換 ========================
        let isSK = true;
        document.getElementById('chatToggleBtn')?.addEventListener('click', function() {
            const iframeChat = document.getElementById('chat_embed');
            if (!iframeChat) return;
            if (isSK) {
                iframeChat.src = 'https://chicktv.github.io/tv/dark.html';
                this.textContent = '💬 TCHAT';
            } else {
                iframeChat.src = 'https://www.twitch.tv/embed/whitewing940920/chat?darkpopout&parent=chicktv.github.io';
                this.textContent = '💬 CCHAT';
            }
            isSK = !isSK;
        });

        // ======================== 彈窗事件綁定 ========================
        function bindModalEvents() {
            const addBtn = document.getElementById('addChannelBtn');
            if (addBtn) addBtn.onclick = openAddChannelModal;
            const confirmBtn = document.getElementById('confirmAddChannel');
            const cancelBtn = document.getElementById('cancelAddChannel');
            if (confirmBtn) confirmBtn.onclick = addChannelFromModal;
            if (cancelBtn) cancelBtn.onclick = closeAddChannelModal;
            const modalMask = document.getElementById('addChannelModal');
            if (modalMask) {
                modalMask.addEventListener('click', (e) => { if (e.target === modalMask) closeAddChannelModal(); });
            }
        }

        // ======================== 初始化與響應式 ========================
        window.addEventListener('resize', () => generateButtons());
        document.addEventListener('DOMContentLoaded', async () => {
            await loadTwitchCredentials();
            await loadChannelsFromUrl();
            bindModalEvents();
            setInterval(fetchAllStatuses, 480000);
        });
        function showPopup() {
            window.open("https://chicktv01.42web.io/add.php", "_blank", "width=800,height=600");
        }
    </script>
