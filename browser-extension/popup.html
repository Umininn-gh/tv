<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Umininn TV 播放器控制</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <main>
        <h1>Umininn TV 播放器控制</h1>
        <p class="version" id="extension-version">正在讀取版本…</p>
        <p>音量、靜音及恢復播放按鈕會顯示在網站內。</p>
        <a class="open-site" href="https://umininn-gh.github.io/tv/" target="_blank" rel="noopener noreferrer">開啟 Umininn TV</a>
        <h2>未看到控制列？</h2>
        <ol>
            <li>安裝或更新擴充功能後，請自行重新整理網站。</li>
            <li>確認已允許原網站及播放器網站的存取權；Firefox 可在附加元件權限內檢查。</li>
            <li>到網站選台，再查看每台的連線及控制狀態。</li>
        </ol>
        <p class="note">恢復播放若被瀏覽器阻擋，請在原播放器親自按播放。任意 BS 網址及未授權網域不在控制範圍。</p>
        <p class="note"><a href="PRIVACY.zh-HK.html" target="_blank" rel="noopener noreferrer">私隱說明</a></p>
    </main>
</body>
</html>
