<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>userscript · Umininn TV</title>
    <link rel="stylesheet" href="./viewer.css">
    <script src="./viewer.js" defer></script>
</head>
<body>
    <main class="viewer">
        <header class="viewer-header">
            <h1>userscript</h1>
            <div class="viewer-actions">
                <a id="install-userscript" class="install-link" href="./umininn-tv-player.user.js">安裝／更新</a>
                <button id="copy-userscript" type="button" disabled>複製全部</button>
            </div>
        </header>
        <p class="viewer-hint">每個瀏覽器安裝一次，並開啟 Tampermonkey 自動更新及自動安裝。更新按管理器設定的週期進行，之後重新整理觀看頁。</p>
        <label for="userscript-source">umininn-tv-player.user.js</label>
        <textarea id="userscript-source" readonly spellcheck="false" wrap="off"
            autocapitalize="off" autocomplete="off" aria-busy="true"
            placeholder="載入中…"></textarea>
        <footer class="viewer-footer">
            <p id="viewer-status" role="status" aria-live="polite" aria-atomic="true">正在載入腳本…</p>
            <button id="retry-userscript" type="button" hidden>重新載入</button>
        </footer>
    </main>
</body>
</html>
