// ===================== 歷史訊息 =====================
let isFetchingHistory = false;
let pendingHistoryRefresh = false;
let pendingOlderHistory = false;
let historyHasLoaded = false;
let oldestHistoryCursor = null;
let historyRetryOlder = null;
let hasMoreHistory = false;
function setHistoryStatus(text) {
    const status = document.getElementById('historyStatus');
    if (status && status.textContent !== text) { status.textContent = text; status.title = text; }
}
function showPausedRetentionStatus() {
    const count = (document.getElementById('messages')?.children.length || 0) + messageBuffer.length;
    setHistoryStatus(`暫停移走舊留言（${count} 則）；按↓恢復上限。`);
}
function updateHistoryButton() {
    const button = document.getElementById('loadMoreHistoryBtn');
    if (!button) return;
    const atCapacity = !retentionPaused && (document.getElementById('messages')?.children.length || 0) >= MAX_MESSAGES;
    const retry = historyRetryOlder !== null;
    const capacityBlocks = atCapacity && historyRetryOlder !== false;
    button.disabled = isFetchingHistory || capacityBlocks || (!retry && !hasMoreHistory);
    button.textContent = capacityBlocks ? '本頁已達保留上限' : retry ? '重試載入留言' : hasMoreHistory ? '載入更早留言' : '已載入可用歷史';
}
function loadMoreHistory() {
    const older = historyRetryOlder ?? (oldestHistoryCursor !== null);
    if (older) pauseChatFollowing();
    return fetchRecentMessages(older);
}
async function fetchRecentMessages(older = false) {
    if (older && !retentionPaused && (document.getElementById('messages')?.children?.length || 0) >= MAX_MESSAGES) {
        setHistoryStatus(`本頁已達 ${MAX_MESSAGES} 則保留上限，停止載入較早留言。`);
        updateHistoryButton();
        return;
    }
    if (isFetchingHistory) {
        pendingHistoryRefresh = true;
        pendingOlderHistory ||= older;
        return;
    }
    if (older && oldestHistoryCursor === null) return;
    isFetchingHistory = true;
    const button = document.getElementById('loadMoreHistoryBtn');
    if (button) button.disabled = true;
    const shouldScroll = autoScroll && !older;
    const limit = older || !historyHasLoaded ? 100 : 800;
    const recovering = !older && historyHasLoaded;
    const recoveryTimestamp = recovering ? latestChatTimestamp : 0;
    const requestUnreadResetVersion = unreadResetVersion;
    const before = older ? `&before=${oldestHistoryCursor}` : '';
    const after = recovering && recoveryTimestamp > 0 ? `&after=${recoveryTimestamp}` : '';
    setHistoryStatus(older ? '正在載入更早留言…' : '正在補回留言…');
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);
    try {
        const response = await fetch(`https://recent-messages.robotty.de/api/v2/recent-messages/${encodeURIComponent(CHANNEL)}?limit=${limit}${before}${after}`, { signal: controller.signal });
        if (!response.ok) throw new Error(`歷史訊息服務回應 ${response.status}`);
        const data = await response.json();
        const rawEvents = Array.isArray(data.messages) ? data.messages : [];
        const previousCursor = oldestHistoryCursor;
        const parsedHistory = rawEvents
            .flatMap(raw => typeof raw === 'string' ? raw.split(/\r?\n/) : [])
            .map(parseIrcLine).filter(Boolean);
        const history = parsedHistory
            .filter(message => message && message.command === 'PRIVMSG' &&
                message.params[0]?.toLowerCase() === `#${CHANNEL.toLowerCase()}`)
            .sort((a, b) => Number(getTagValue(a.tags, 'tmi-sent-ts') || getTagValue(a.tags, 'rm-received-ts') || 0) -
                Number(getTagValue(b.tags, 'tmi-sent-ts') || getTagValue(b.tags, 'rm-received-ts') || 0));
        const unique = new Map();
        history.forEach(message => unique.set(chatMessageKey(message) || message, message));
        const available = Array.from(unique.values());
        const remainingCapacity = retentionPaused ? Infinity : Math.max(0, MAX_MESSAGES - (document.getElementById('messages')?.children.length || 0) - messageBuffer.length);
        const batchSize = older ? Math.min(CHAT_HISTORY_BATCH_SIZE, remainingCapacity) : CHAT_HISTORY_BATCH_SIZE;
        const messages = recovering ? available.filter(message =>
            Number(getTagValue(message.tags, 'tmi-sent-ts') || getTagValue(message.tags, 'rm-received-ts')) >= recoveryTimestamp
        ) : batchSize ? available.slice(-batchSize) : [];
        messages.forEach(message => {
            const timestamp = Number(getTagValue(message.tags, 'tmi-sent-ts') || getTagValue(message.tags, 'rm-received-ts'));
            const countAsNew = recovering && requestUnreadResetVersion === unreadResetVersion && timestamp >= unreadWatermark;
            try { renderChatMessage(message, true, countAsNew); }
            catch (err) { console.error('處理歷史訊息錯誤:', err); }
        });
        // 向前翻頁以實際顯示的最早留言為界，避免跳過未顯示的紀錄。
        const cursorMessages = older && !remainingCapacity ? [] : messages.length ? messages : parsedHistory;
        const cursors = cursorMessages.map(message => Number(getTagValue(message.tags, 'rm-received-ts') || getTagValue(message.tags, 'tmi-sent-ts')))
            .filter(time => Number.isFinite(time) && time > 0);
        if (!recovering) {
            const retainedCursor = !older && !retentionPaused && (document.getElementById('messages')?.children.length || 0) >= MAX_MESSAGES ? getOldestRetainedHistoryCursor() : null;
            if (retainedCursor !== null) oldestHistoryCursor = retainedCursor;
            else if (cursors.length) oldestHistoryCursor = Math.min(oldestHistoryCursor ?? Infinity, ...cursors);
        }
        historyHasLoaded = true;
        historyRetryOlder = null;
        const advanced = oldestHistoryCursor !== null && (previousCursor === null || oldestHistoryCursor < previousCursor);
        if (!recovering && !(older && !remainingCapacity)) {
            const hasUnshownMessages = !recovering && available.length > messages.length;
            hasMoreHistory = oldestHistoryCursor !== null && !(older && (!advanced || (!hasUnshownMessages && rawEvents.length < limit)));
        }
        setHistoryStatus(older && !advanced ? '暫時沒有更早的可用留言。' : '留言已更新；可載入更早留言。');
        if (retentionPaused) showPausedRetentionStatus();
        else if ((document.getElementById('messages')?.children?.length || 0) >= MAX_MESSAGES) {
            setHistoryStatus(`目前保留 ${MAX_MESSAGES} 則；已達上限，停止載入較早留言。`);
        }
    } catch (err) {
        console.error('獲取歷史訊息失敗:', err);
        historyRetryOlder = older;
        setHistoryStatus('歷史載入失敗，即時訊息仍會繼續；可稍後再試。');
        if (button) {
            button.disabled = false;
            button.textContent = '重試載入留言';
        }
    }
    finally {
        clearTimeout(timeoutId);
        isFetchingHistory = false;
        updateHistoryButton();
        if (pendingHistoryRefresh) {
            pendingHistoryRefresh = false;
            const nextOlder = pendingOlderHistory;
            pendingOlderHistory = false;
            fetchRecentMessages(nextOlder);
        }
    }
    if (shouldScroll && autoScroll) forceScrollToBottom();
    setTimeout(() => { isInitialLoad = false; }, 8000);
}

// ===================== 連線邏輯 =====================
function escapeChatText(value) {
    return String(value ?? '').replace(/[&<>"']/g, char =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}
const trustedChatHtml = new Map();
const chatHtmlPrefix = `__CHAT_${Math.random().toString(36).slice(2)}_`;
let chatHtmlCounter = 0;
function protectChatHtml(html) {
    const token = `${chatHtmlPrefix}${++chatHtmlCounter}__`;
    trustedChatHtml.set(token, html);
    if (trustedChatHtml.size > 200) trustedChatHtml.delete(trustedChatHtml.keys().next().value);
    return token;
}
function restoreChatHtml(text) {
    for (const [token, html] of trustedChatHtml) {
        if (text.includes(token)) {
            text = text.split(token).join(html);
            trustedChatHtml.delete(token);
        }
    }
    return text;
}

function parseIrcLine(line) {
    const match = line.match(/^(?:@([^ ]+) )?(?::([^ ]+) )?([A-Za-z0-9]+)(?: ([\s\S]*))?$/);
    if (!match) return null;
    let params = match[4] || '';
    let body = '';
    const bodyIndex = params.startsWith(':') ? 0 : params.indexOf(' :');
    if (bodyIndex !== -1) {
        body = params.substring(bodyIndex + (bodyIndex === 0 ? 1 : 2));
        params = params.substring(0, bodyIndex);
    }
    const command = match[3].toUpperCase();
    const middleParams = params.split(/ +/).filter(Boolean);
    // IRC 最後一個參數若沒有空格，可不加冒號，例如 PRIVMSG #channel 哇。
    if (command === 'PRIVMSG' && bodyIndex === -1 && middleParams.length > 1) {
        body = middleParams.splice(1).join(' ');
    }
    return { tags: match[1] || '', source: match[2] || '', command, params: middleParams, body };
}
const seenMessageIds = new Set();
function trimSeenMessageIds() {
    if (retentionPaused || seenMessageIds.size <= 2000) return;
    const retainedKeys = new Set(Array.from(document.querySelectorAll('#messages .chat-line'), row => row.dataset.messageKey || row.dataset.messageId));
    messageBuffer.forEach(message => { if (message.key) retainedKeys.add(message.key); });
    for (const key of seenMessageIds) {
        if (seenMessageIds.size <= 2000) break;
        if (!retainedKeys.has(key)) seenMessageIds.delete(key);
    }
}
let latestChatTimestamp = 0;
let chatResourcesReady = false;
let hasJoinedChannel = false;
let needsHistoryRefresh = false;
function chatMessageKey(message) {
    const id = getTagValue(message.tags, 'id');
    const ts = getTagValue(message.tags, 'tmi-sent-ts') || getTagValue(message.tags, 'rm-received-ts');
    return id || (ts ? `${message.params[0]}:${message.source}:${ts}:${message.body}` : null);
}
function renderChatMessage(message, historical = false, countAsNew = !historical) {
    if (message.command !== "PRIVMSG" || message.params[0]?.toLowerCase() !== `#${CHANNEL.toLowerCase()}`) return;
    const timestamp = Number(getTagValue(message.tags, 'tmi-sent-ts') || getTagValue(message.tags, 'rm-received-ts'));
    if (Number.isFinite(timestamp) && timestamp > 0) latestChatTimestamp = Math.max(latestChatTimestamp, timestamp);
    const key = chatMessageKey(message);
    if (key && seenMessageIds.has(key)) return;
    let line;
    try { line = buildChatMessageHtml(message, historical); }
    catch (err) {
        console.error('訊息格式轉換失敗，保留原文:', err);
        const ts = getTagValue(message.tags, 'tmi-sent-ts') || getTagValue(message.tags, 'rm-received-ts') || Date.now().toString();
        const user = getTagValue(message.tags, 'display-name') || message.source.split('!')[0];
        line = `<div class="chat-line" data-msg-ts="${escapeChatText(ts)}"><b>${escapeChatText(user)}:</b> <span>${escapeChatText(message.body)}</span></div>`;
    }
    if (key) line = line.replace(/^<div\b/, () => `<div data-message-key="${escapeChatText(key)}"`);
    if (key) seenMessageIds.add(key);
    try { appendMessageWithScroll(line, key); }
    catch (err) { if (key) seenMessageIds.delete(key); throw err; }
    if (retentionPaused && countAsNew) { unreadMessageCount++; updateUnreadCounter(); }
    trimSeenMessageIds();
}

function buildChatMessageHtml(message, historical = false) {
    const tags = message.tags;
    const rawMsg = message.body;
    const nickFromSource = message.source.split("!")[0];
    let msgId = getTagValue(tags, "id");
    let ts = getTagValue(tags, "tmi-sent-ts") || getTagValue(tags, "rm-received-ts") || Date.now().toString();
    let color = getTagValue(tags, "color") || "#9147ff";
    let badgeStr = getTagValue(tags, "badges");
    let userLogin = nickFromSource || getTagValue(tags, "login") || "";
    let displayNameRaw = getTagValue(tags, "display-name");
    let user = displayNameRaw || userLogin || "User";
    userCache[userLogin] = user;
    let msgRecord = {
        content: rawMsg, user: { login: userLogin, displayName: user }, displayName: user,
        badges: badgeStr, avatar: 'https://static-cdn.jtvnw.net/user-default-pictures-uv/75305d54-c7cc-40d1-bb9c-91fbe85943c7-profile_image-70x70.png',
        timestamp: parseInt(ts), ircMessage: message
    };
    if (msgId) msgCache[msgId] = msgRecord;
    msgCache[ts] = msgRecord;
    addRecentUser({ login: userLogin, displayName: user, badges: badgeStr, avatar: msgRecord.avatar });
    let replyHtml = "", displayMsg = rawMsg;
    let pUser = getTagValue(tags, "reply-parent-display-name");
    let pId = getTagValue(tags, "reply-parent-msg-id");
    let pBodyRaw = getTagValue(tags, "reply-parent-msg-body");
    if (pUser && pId) {
        let isMe = (pUser === myDisplayName || pUser === myLoginId);
        let originalText = pBodyRaw ? pBodyRaw.replace(/\\([s:nr\\])/g, (_, char) =>
            ({ s: ' ', ':': ';', n: '\n', r: '\r', '\\': '\\' })[char]) : "...";
        let processed = processRTag(originalText, 0);
        let pBody = parseContent(processed, true);
        let userTagClass = isMe ? 'quote-user mention-self-tag' : 'quote-user';
        replyHtml = `<div class="quote-box" onclick="scrollToMsg('${escapeChatText(pId)}')"><svg width="17" height="17" viewBox="0 0 24 20" fill="currentColor"><path d="M9 10h2v2H9v-2Zm6 0h-2v2h2v-2Z"></path><path fill-rule="evenodd" d="m12 22-3-3H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 2 2h-4l-3 3Zm-2.172-5L12 19.172 14.172 17H19V5H5v12h4.828Z" clip-rule="evenodd"></path></svg> 回覆<span class="${userTagClass}">@${escapeChatText(pUser)}:</span>${pBody}</div>`;
        const mentions = [pUser, getTagValue(tags, 'reply-parent-user-login')].filter(Boolean);
        const mention = mentions.find(name => displayMsg.toLowerCase().startsWith(`@${name.toLowerCase()} `));
        if (mention) displayMsg = displayMsg.substring(mention.length + 2);
    }
    displayMsg = processRTag(displayMsg, 0);
    displayMsg = highlightSelfMentions(displayMsg);
    let contentHtml = parseContent(displayMsg, true);
    let badgeHtml = renderBadges(badgeStr);
    const replyAction = escapeChatText(`replyNative(${JSON.stringify(userLogin)},${JSON.stringify(msgId || ts)},${JSON.stringify(user)})`);
    let line = `<div class="chat-line ${historical ? 'historical-msg ' : ''}ts-${escapeChatText(ts)} id-${escapeChatText(msgId||ts)}" data-message-id="${escapeChatText(msgId || ts)}" data-user-login="${escapeChatText(userLogin)}" data-msg-ts="${escapeChatText(ts)}">
        <div class="reply-btn-group">
            <div class="reply-btn" onclick="${replyAction}"><img src="./re2.png"></div>
            <div class="reply-btn2" onclick="insertRecursiveQuote('${userLogin}','${ts}')" title="插入引用代碼 [r]">🔗</div>
        </div>
        <b style="color:${/^#[0-9a-f]{6}$/i.test(color) ? color : '#9147ff'}">${badgeHtml}${formatNameHtml(user, userLogin)}:</b> <span>${replyHtml}${contentHtml}</span>
    </div>`;
    return line;
}

function refreshVisibleMessages() {
    const viewport = captureChatViewport();
    document.querySelectorAll('#messages .chat-line[data-message-id]').forEach(row => {
        const record = msgCache[row.dataset.messageId];
        if (!record?.ircMessage) return;
        try {
            const replacement = $(buildChatMessageHtml(record.ircMessage, row.classList.contains('historical-msg')));
            if (row.dataset.messageKey) replacement.attr('data-message-key', row.dataset.messageKey);
            addTimestampsToElements(replacement);
            row.querySelectorAll('video').forEach(video => mediaObserver.unobserve(video));
            row.replaceWith(replacement[0]);
            replacement.find('video.media-preview').each(function() { mediaObserver.observe(this); });
        } catch (err) { console.warn('更新訊息資源失敗，保留目前內容:', err); }
    });
    restoreChatViewport(viewport);
    if (autoScroll) forceScrollToBottom();
}

function startChat(forceRestart = false) {
    if (!forceRestart && isConnecting) return;
    if (!forceRestart && socket && socket.readyState === WebSocket.OPEN) return;
    if (socket) {
        const previousSocket = socket;
        socket = null;
        previousSocket.onopen = previousSocket.onmessage = previousSocket.onerror = previousSocket.onclose = null;
        try { previousSocket.close(); } catch(e) {}
    }
    isConnecting = true;
    hasJoinedChannel = false;
    clearReconnectTimer();
    const ownedSocket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    socket = ownedSocket;
    ownedSocket.onopen = () => {
        if (socket !== ownedSocket) return;
        isConnecting = false;
        clearReconnectTimer();
        ownedSocket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
        let pass, nick;
        if (ACCESS_TOKEN) {
            pass = `oauth:${ACCESS_TOKEN}`;
            nick = myLoginId || 'justinfan' + Math.floor(Math.random()*900000+100000);
        } else {
            let rand = Math.floor(Math.random()*900000)+100000;
            pass = `justinfan${rand}`;
            nick = `justinfan${rand}`;
        }
        ownedSocket.send(`PASS ${pass}`);
        ownedSocket.send(`NICK ${nick}`);
        ownedSocket.send(`JOIN #${CHANNEL}`);
        let statusMsg = ACCESS_TOKEN ? `連線至 ${CHANNEL}` : `匿名觀看 ${CHANNEL}`;
        document.getElementById('status').innerHTML = statusMsg;
        document.getElementById('msginput').disabled = !ACCESS_TOKEN;
        document.getElementById('sendbtn').disabled = false;
        hasJoinedChannel = false;
        needsHistoryRefresh = true;
    };
    ownedSocket.onerror = (err) => {
        if (socket !== ownedSocket) return;
        document.getElementById('status').textContent = '連線錯誤，即將重連...';
    };
    ownedSocket.onclose = (event) => {
        if (socket !== ownedSocket) return;
        isConnecting = false;
        hasJoinedChannel = false;
        socket = null;
        scheduleReconnect();
        document.getElementById('status').textContent = `已斷線 (${event.code})，重連中...`;
    };
    ownedSocket.onmessage = (e) => {
        if (socket !== ownedSocket) return;
        // 一個 WebSocket frame 可能包含多個 IRC 命令，逐行處理並隔離錯誤。
        String(e.data).split(/\r?\n/).forEach(data => {
            try {
                if (socket !== ownedSocket) return;
                const message = parseIrcLine(data);
                if (!message) return;
                if (message.command === 'NOTICE' && ACCESS_TOKEN &&
                    /authentication failed|login unsuccessful|improperly formatted auth/i.test(message.body)) {
                    switchToAnonymousChat();
                    return;
                }
                if (['JOIN', 'ROOMSTATE', '366'].includes(message.command) &&
                    message.params.some(param => param.toLowerCase() === `#${CHANNEL.toLowerCase()}`)) {
                    hasJoinedChannel = true;
                    if (chatResourcesReady && needsHistoryRefresh) {
                        needsHistoryRefresh = false;
                        fetchRecentMessages();
                    }
                }
                if (message.command === 'PING') {
                    ownedSocket.send(`PONG :${message.body || message.params[0] || 'tmi.twitch.tv'}`);
                    return;
                }
                if (message.command === 'RECONNECT') {
                    ownedSocket.close();
                    scheduleReconnect();
                    return;
                }
                if (message.command === 'USERSTATE') {
                    const badgeTag = getTagValue(message.tags, 'badges');
                    if (badgeTag) {
                        myBadges = badgeTag;
                        localStorage.setItem('twitch_my_badges', badgeTag);
                        updateBadgeCarousel();
                    }
                    const colorTag = getTagValue(message.tags, 'color');
                    if (colorTag) myColor = colorTag;
                    return;
                }
                renderChatMessage(message);
            } catch (err) { console.error('處理訊息錯誤:', err); }
        });
    };
}

// ===================== 登入與初始化 =====================
function checkLogin() {
    const saved = localStorage.getItem('twitch_token');
    if (saved) {
        ACCESS_TOKEN = saved.replace('oauth:', '');
        fetchUserInfo(ACCESS_TOKEN);
    } else startChat();
}
function loginWithPopup() {
    const width = 600, height = 700;
    const left = (screen.width - width) / 2;
    const top = (screen.height - height) / 2;
    const popup = window.open(AUTH_URL, 'Twitch Login', `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=yes`);
    if (!popup) return alert('彈出視窗被阻擋！');
    const check = setInterval(() => {
        if (!popup.closed) return;
        clearInterval(check);
        const token = localStorage.getItem('twitch_token');
        if (token) {
            ACCESS_TOKEN = token.replace('oauth:', '');
            fetchUserInfo(ACCESS_TOKEN);
        }
    }, 500);
}
let userInfoRequestId = 0;
function switchToAnonymousChat() {
    userInfoRequestId++;
    localStorage.removeItem('twitch_token');
    localStorage.removeItem('twitch_my_badges');
    ACCESS_TOKEN = '';
    myLoginId = myDisplayName = myAvatar = myBadges = '';
    myColor = '#9147ff';
    document.getElementById('loginBtn').style.display = '';
    document.getElementById('userInfo').style.display = 'none';
    document.getElementById('userName').textContent = '';
    document.getElementById('userAvatar').removeAttribute('src');
    document.getElementById('status').textContent = '正在連線至匿名聊天室...';
    startChat(true);
}
async function fetchUserInfo(token) {
    const requestId = ++userInfoRequestId;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);
    try {
        const res = await fetch('https://api.twitch.tv/helix/users', {
            signal: controller.signal,
            headers: { 'Client-ID': CLIENT_ID, 'Authorization': 'Bearer ' + token }
        });
        if (requestId !== userInfoRequestId) return;
        if (!res.ok) throw new Error(`Twitch 登入資料回應 ${res.status}`);
        const data = await res.json();
        if (requestId !== userInfoRequestId) return;
        if (!data.data?.[0]?.login) throw new Error('Twitch 登入資料沒有使用者');
        myLoginId = data.data[0].login;
        myDisplayName = data.data[0].display_name || myLoginId;
        myAvatar = data.data[0].profile_image_url || '';
        loginSuccess();
    } catch(e) {
        if (requestId !== userInfoRequestId) return;
        console.error('Twitch 登入失效，改用匿名觀看:', e);
        switchToAnonymousChat();
    } finally { clearTimeout(timeoutId); }
}
function loginSuccess() {
    document.getElementById('status').textContent = `已登入：${myDisplayName}`;
    document.getElementById('msginput').disabled = false;
    document.getElementById('sendbtn').disabled = false;
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('userInfo').style.display = 'none';
    document.getElementById('userAvatar').src = myAvatar;
    document.getElementById('userName').textContent = myDisplayName;
    startChat(true);
}
function logout() {
    switchToAnonymousChat();
}

function setupAutoTag() {
    const input = document.getElementById('msginput');
    if (!input) return;
    input.addEventListener('paste', (e) => {
        let pastedText = (e.clipboardData || window.clipboardData).getData('text');
        if (!pastedText) return;
        const trimmedPaste = pastedText.trim();
        if (!trimmedPaste.startsWith('http')) return;
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        const range = selection.getRangeAt(0);
        const preRange = range.cloneRange();
        preRange.selectNodeContents(input);
        preRange.setEnd(range.startContainer, range.startOffset);
        const textBefore = preRange.toString();
        let suffix = "";
        if (/\[s\]\s*$/i.test(textBefore)) { suffix = " [e]"; }
        else if (/\[y\]\s*$/i.test(textBefore)) { suffix = " [t]"; }
        else if (/\[a\]\s*$/i.test(textBefore)) { suffix = " [o]"; }
        if (suffix) {
            e.preventDefault();
            const finalInsert = trimmedPaste + suffix + " ";
            document.execCommand('insertText', false, finalInsert);
            input.dispatchEvent(new Event('input', { bubbles: true }));
        }
    });
}

function setupEmojiPanelDrag() {
    const panel = document.getElementById('emojiPanel');
    const header = panel.querySelector('.emoji-header');
    const closeBtn = document.getElementById('emojiCloseBtn');
    header.addEventListener('mousedown', (e) => {
        if (e.target === closeBtn || e.target.closest('#emojiCloseBtn')) return;
        dragging = true;
        offsetX = e.clientX - panel.offsetLeft;
        offsetY = e.clientY - panel.offsetTop;
        panel.classList.add('dragging');
        e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        panel.style.left = (e.clientX - offsetX) + 'px';
        panel.style.top = (e.clientY - offsetY) + 'px';
        panel.style.transform = 'none';
    }, { passive: true });
    document.addEventListener('mouseup', () => { dragging = false; panel.classList.remove('dragging'); });
    closeBtn.addEventListener('click', () => panel.style.display = 'none');
}

// ===================== 初始化應用 =====================
async function initApp() {
    // 先套用媒體大小設定（避免畫面閃爍）
    applyMediaSizeFromStorage();

    if (location.hash.includes('access_token=')) {
        const token = new URLSearchParams(location.hash.slice(1)).get('access_token');
        if (token) {
            localStorage.setItem('twitch_token', 'oauth:' + token);
            if (window.opener) window.close();
            else {
                history.replaceState(null, null, location.pathname);
                ACCESS_TOKEN = token;
                fetchUserInfo(token);
            }
        }
    } else checkLogin();
    document.getElementById('loginBtn').onclick = loginWithPopup;
    document.getElementById('logoutBtn').onclick = logout;
    setupScrollListener();
    chatResourcesReady = true;
    Promise.allSettled([fetchBadges(), loadResources()]).then(() => {
        updateBadgeCarousel();
        refreshVisibleMessages();
    });
    updateBadgeCarousel();
    setupAutoTag();
    setupMentionEvents();
    setupEmojiPanelDrag();
    if (!ACCESS_TOKEN) startChat();
    if (hasJoinedChannel) {
        needsHistoryRefresh = false;
        fetchRecentMessages();
    }
    if(scrollToBottomBtn) scrollToBottomBtn.addEventListener('click', () => forceScrollToBottom(true));
    updateUnreadCounter();
    const messagesContainer = document.getElementById('messages');
    if (messagesContainer) {
        const resizeObserver = new ResizeObserver(() => {
            if (autoScroll) forceScrollToBottom();
            else restoreChatViewport(readingAnchor);
        });
        resizeObserver.observe(messagesContainer);
        const chatContainer = document.getElementById('chat-container');
        if (chatContainer) resizeObserver.observe(chatContainer);
    }
    document.getElementById('msginput').addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
    });
}

initApp();

// ===================== 設定與樣式管理 =====================
function openSettings() {
    $('#channelInput').val(CHANNEL);
    const savedTheme = localStorage.getItem('chat_theme') || 'default';
    $('#themeSelect').val(savedTheme);
    $('#showUsernameToggle').prop('checked', showUsernameInChat);
    $('#showTimestampToggle').prop('checked', showTimestamp);
    // 載入媒體大小設定
    let imgH = parseInt(localStorage.getItem('chat_img_max_height'), 10);
    let videoH = parseInt(localStorage.getItem('chat_video_max_height'), 10);
    if (isNaN(imgH) || imgH < 20) imgH = DEFAULT_IMG_MAX_HEIGHT;
    if (isNaN(videoH) || videoH < 20) videoH = DEFAULT_VIDEO_MAX_HEIGHT;
    $('#imgMaxHeightInput').val(imgH);
    $('#videoMaxHeightInput').val(videoH);
    $('#settingsPanel').css('display', 'flex');
}
function closeSettings() { $('#settingsPanel').hide(); }
function changeChannelBtn() {
    const newChannel = $('#channelInput').val().trim();
    if (newChannel) { localStorage.setItem('twitch_channel', newChannel); location.reload(); }
}
function changeTheme(theme) {
    const viewport = captureChatViewport();
    localStorage.setItem('chat_theme', theme);
    applyTheme(theme);
    restoreChatViewport(viewport);
    forceScrollToBottom();
}
function toggleShowUsername(enabled) {
    localStorage.setItem('chat_show_username', enabled ? 'true' : 'false');
    showUsernameInChat = enabled;
    location.reload();
}
function toggleShowTimestamp(enabled) {
    localStorage.setItem('chat_show_timestamp', enabled ? 'true' : 'false');
    showTimestamp = enabled;
    document.body.classList.toggle('hide-timestamps', !enabled);
    if (enabled) {
        $('.chat-line').each(function() {
            const $el = $(this);
            if ($el.find('.msg-time').length) return;
            const ts = $el.attr('data-msg-ts');
            $el.prepend(`<span class="msg-time">${formatMsgTime(ts)}</span>`);
        });
    } else {
        $('.msg-time').remove();
    }
}
function applyTheme(theme) {
    document.body.classList.remove('theme-whatsapp', 'theme-whatsapp-dark', 'theme-discord', 'theme-sk');
    if (theme && theme !== 'default') { document.body.classList.add('theme-' + theme); }
}

$(document).ready(function() {
    const savedTheme = localStorage.getItem('chat_theme') || 'discord';
    applyTheme(savedTheme);
    if (!showTimestamp) document.body.classList.add('hide-timestamps');
    const msgContainer = document.getElementById('messages');
    if (msgContainer) {
        const chatObserver = new MutationObserver((mutations) => {
            if (!myLoginId) return;
            mutations.forEach(mutation => {
                mutation.addedNodes.forEach(node => {
                    if (node.nodeType === 1 && node.classList.contains('chat-line')) {
                        if (node.getAttribute('data-user-login') === myLoginId) {
                            node.classList.add('msg-self');
                        }
                    }
                });
            });
        });
        chatObserver.observe(msgContainer, { childList: true });
    }
});
